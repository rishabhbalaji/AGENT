[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-job-application-engine"
version = "0.1.0"
description = "A local-first job discovery and application assistant."
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "pypdf>=5.0,<7",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "google-api-python-client>=2.150,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
test = ["httpx2"]

[project.scripts]
job-engine = "job_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

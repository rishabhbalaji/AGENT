[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-job-application-engine"
version = "0.1.0"
description = "A local-first job discovery and application assistant."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
job-engine = "job_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

version: 1

sources:
  public_ats:
    enabled: true
    authentication: none
    rate_limit_per_minute: 30
  govuk_find_a_job:
    enabled: true
    authentication: none
    rate_limit_per_minute: 10
  reed:
    enabled: true
    authentication: api_key_later
    rate_limit_per_minute: 10
    api_key_env: REED_API_KEY
    keywords: "graduate Python"
    location: "United Kingdom"
  adzuna:
    enabled: true
    authentication: api_key_later
    rate_limit_per_minute: 10
    app_id_env: ADZUNA_APP_ID
    app_key_env: ADZUNA_APP_KEY
    keywords: "graduate Python"
    location: "United Kingdom"
  remote_feeds:
    enabled: true
    authentication: none
    rate_limit_per_minute: 10
  guest_aggregators:
    enabled: false
    authentication: none
    rate_limit_per_minute: 5
    allowed_hosts: []

policy:
  jitter_seconds:
    minimum: 2
    maximum: 15
  retries: 2
  backoff_on_block: true
  never_authenticate_to:
    - linkedin
    - indeed

version: 1

storage:
  require_sda_device: true
  data_root: /mnt/sda/job-engine
  refuse_read_only: true

discovery:
  suitable_jobs_target_per_day: 15
  submissions_are_not_a_quota: true

ollama:
  required_for_engine: true
  endpoint: http://127.0.0.1:11434
  model: qwen3:14b-16k
  deep_review_model: qwen3-coder-64k:latest

gmail:
  enabled: false
  lookback_hours: 72
  max_messages: 100
  query: in:anywhere
  client_secret_path: config/local/gmail-client-secret.json
  token_path: runtime/gmail-token.json

agent_corner:
  enabled: true
  data_root: agent-corner-runtime
  production_root: runtime

deep_review:
  max_actionable_queue_depth: 0

clearance:
  exclude_required_or_requested:
    - SC
    - SC Clearance
    - Security Check

company_exclusions: []
  # Add exact company names, aliases, domains, and a human-readable reason.
  # - name: Example Holdings
  #   aliases: [Example Ltd]
  #   domains: [example.com]
  #   reason: Existing application conflict

applications:
  default_mode: approval_required
  autonomous_mode_requires_allowlist: true
  first_live_provider: greenhouse
  allowed_providers: []
  park_on:
    - captcha
    - mfa
    - unexpected_page
    - changed_form
    - ambiguous_question
    - unsupported_account_creation

retention:
  application_evidence: indefinite
  raw_job_snapshots: 365d
  redundant_caches: configurable
